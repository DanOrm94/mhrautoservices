name = "mhr-auto-services"
compatibility_date = "2026-08-17"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "mhr-auto-services"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "mhr-auto-services-assets"

[vars]
ADMIN_EMAIL = "set-in-cloudflare-dashboard"
GARAGE_NAME = "MHR Auto Services"
INVOICE_PREFIX = "MHR"
PUBLIC_ASSET_BASE_URL = "set-in-cloudflare-dashboard"

# Secrets to configure in Cloudflare (never commit values):
# JWT_SECRET
# ADMIN_PASSWORD_HASH
# RESEND_API_KEY
