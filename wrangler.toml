name = "mhr-auto-services"
compatibility_date = "2026-08-17"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "mhr-auto-services"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mhr-auto-services-assets"

[vars]
GARAGE_NAME = "MHR Auto Services"
INVOICE_PREFIX = "MHR"
PUBLIC_ASSET_BASE_URL = "set-in-cloudflare-dashboard"

[secrets]
required = ["JWT_SECRET", "ADMIN_PASSWORD_HASH", "RESEND_API_KEY", "ADMIN_EMAIL"]

# Create the secrets in the Cloudflare dashboard or with Wrangler.
# Never commit secret values to this file.
